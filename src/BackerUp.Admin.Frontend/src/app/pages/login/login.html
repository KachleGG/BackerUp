<div class="login-page">
    <div class="login-card page-card p-4 p-md-5">
        <h1 class="h3 fw-semibold mb-4 text-center">Přihlaste se</h1>

        <form class="d-grid gap-3">
            <div>
                <label class="form-label fw-medium">Uživatelské jméno</label>
                <input class="form-control form-control-lg" type="text" autocomplete="username" />
            </div>
            <div>
                <label class="form-label fw-medium">Heslo</label>
                <input class="form-control form-control-lg" type="password" autocomplete="current-password" />
            </div>
            <button routerLink="/dashboard" class="btn btn-primary btn-lg w-100" type="button">Přihlásit se</button>
        </form>
    </div>
</div>
