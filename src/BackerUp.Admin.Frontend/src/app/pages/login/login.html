<div class="login-page">
    <div class="login-card page-card p-4 p-md-5">
        <h1 class="h3 fw-semibold mb-4 text-center">Přihlášení</h1>

        <form class="d-grid gap-3" (ngSubmit)="submit()">
            <div>
                <label class="form-label fw-medium">Uživatelské jméno</label>
                <input class="form-control form-control-lg" type="text" autocomplete="username" [(ngModel)]="username" name="username" required />
            </div>
            <div>
                <label class="form-label fw-medium">Heslo</label>
                <input class="form-control form-control-lg" type="password" autocomplete="current-password" [(ngModel)]="password" name="password" required />
            </div>
            @if (errorMessage) {
              <div class="alert alert-danger mb-0">{{ errorMessage }}</div>
            }
            <button class="btn btn-primary btn-lg w-100" type="submit" [disabled]="loading">Přihlásit se</button>
        </form>
    </div>
</div>
