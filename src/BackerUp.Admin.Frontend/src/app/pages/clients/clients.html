<div class="wrapper container-xxl py-3">
  <div class="page-card p-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <h2 class="page-heading mb-0">Clients</h2>
    </div>
    <button class="btn btn-sm btn-outline-primary" (click)="add()">Add Client</button>
  </div>
  <div class="page-card p-3 p-lg-4">
    <div class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Active</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (client of clients(); track client.id) {
        <tr>
          <td>{{ client.id }}</td>
          <td>{{ client.name }}</td>
          <td>{{ client.isActive }}</td>
          <td>{{ client.createdAt | date:'short' }}</td>
          <td>
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="edit(client.id)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(client.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
      </table>
    </div>
  </div>
</div>
