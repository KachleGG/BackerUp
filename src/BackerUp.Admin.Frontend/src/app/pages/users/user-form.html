<div class="wrapper container-xxl py-4">
  <form (ngSubmit)="save()" class="page-card p-4 p-lg-5">
    <div class="mb-4">
      <p class="page-kicker mb-1">Users</p>
      <h1 class="page-title h3 mb-1">{{ isEdit ? 'Edit User' : 'Add User' }}</h1>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Username</label>
        <input class="form-control form-control-lg" type="text" [(ngModel)]="username" name="username" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control form-control-lg" type="password" [(ngModel)]="password" name="password" [required]="!isEdit" />
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-end mt-4">
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Cancel</button>
      <button class="btn btn-primary" type="submit">Save user</button>
    </div>
  </form>
</div>
